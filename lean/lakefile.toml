name = "Louvian_Modularity_Max"
version = "0.2.0"
defaultTargets = ["LouvainProof"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.19.0"

[[lean_lib]]
name = "LouvainProof"
roots = ["Path", "Enumeration", "Graph", "Jaccard", "LocalGain", "Completeness", "RawJaccard", "BreakpointCount", "VisitCount", "CandidateCount", "LinearMenu", "DenseMenu", "Decisions", "MeteredTables", "MeteredDecision", "MeteredControl", "MeteredLevels", "MeteredScan", "MeteredScores", "JaccardProgram", "ArithmeticBound", "ScoredPath", "SeuratFuel", "SeuratLabels", "SeuratLocal", "SeuratRoots", "SeuratOrder", "SeuratFlow", "SeuratCost", "SeuratJaccard", "SeuratStackFlow", "SeuratLevelValidity"]
