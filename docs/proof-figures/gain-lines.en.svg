  <title id="figure-title">Modularity gain for each destination of A as resolution increases</title>
  <desc id="figure-desc">At resolution zero, B and C tie. C has the greatest gain between zero and one. C and D tie at one; D has the greatest gain between one and two. D and staying tie at two. Staying has the greatest gain above two. Dashed vertical guides mark these three resolution values.</desc>
